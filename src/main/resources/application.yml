server:
  port: 8080

spring:
  config:
    import:
      - optional:classpath:application-secret.yml
      - optional:file:./application-secret.yml
      - optional:file:../application-secret.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/duo}
    username: ${DB_USERNAME:duo}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

riot:
  api:
    key: ${RIOT_API_KEY:dummy_key}
    regional-url: https://asia.api.riotgames.com
    platform-url: https://kr.api.riotgames.com

    
rabbitmq:
  host: ${RABBITMQ_HOST:localhost}
  port: ${RABBITMQ_STOMP_PORT:61613}
  username: ${RABBITMQ_USERNAME:appuser}
  password: ${RABBITMQ_PASSWORD:apppass}

# ---------------------------------------------------------------------------
# Observability (Actuator + Micrometer)
#
# 관리 포트를 앱 포트(8080)와 분리한다. compose 에서 8081 을 호스트에 게시하지
# 않으므로 외부에서는 접근할 수 없고, 같은 docker network 의 Prometheus 만
# gamehouse-backend:8081/actuator/prometheus 로 수집할 수 있다.
#
# exposure.include 는 화이트리스트다. /actuator/env, /actuator/heapdump 같은
# 민감한 엔드포인트가 열리지 않도록 필요한 것만 나열한다.
# ---------------------------------------------------------------------------
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: gamehouse-backend
    distribution:
      # p95 / p99 를 구하려면 _bucket 메트릭이 필요하다.
      # Spring Boot 기본값은 _count / _sum / _max 만 내보내므로
      # 이 설정이 없으면 histogram_quantile(...) 이 항상 빈 결과가 된다.
      percentiles-histogram:
        http.server.requests: true    # 앱 응답시간 (우리가 받는 요청)
        http.client.requests: true    # Riot API 응답시간 (우리가 보내는 요청)
      # 관심 구간을 명시해 버킷 수를 줄인다.
      # percentiles-histogram 만 켜면 버킷이 수십 개 생겨 시계열이 불필요하게 늘어난다.
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s, 2s, 5s
        http.client.requests: 100ms, 300ms, 500ms, 1s, 2s, 5s
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 10s
  observations:
    key-values:
      env: ${ENV_NAME:local}