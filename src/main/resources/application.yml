server:
  port: 8080

spring:
  config:
    import:
      - optional:classpath:application-secret.yml
      - optional:file:./application-secret.yml
      - optional:file:../application-secret.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/duo}
    username: ${DB_USERNAME:duo}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

riot:
  api:
    key: ${RIOT_API_KEY}
    regional-url: https://asia.api.riotgames.com
    platform-url: https://kr.api.riotgames.com