server:
  port: 8080

spring:
  config:
    import:
      - optional:classpath:application-secret.yml
      - optional:file:./application-secret.yml
      - optional:file:../application-secret.yml
  datasource:
    url: jdbc:mysql://localhost:3306/duo?useSSL=false&serverTimezone=Asia/Seoul
    username: root
    password: 본인_DB_비밀번호
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

jwt:
  secret: my-duo-project-jwt-secret-key-for-local-development-environment-12345
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

riot:
  api:
    key: ${RIOT_API_KEY:dummy_key}
    regional-url: https://asia.api.riotgames.com
    platform-url: https://kr.api.riotgames.com