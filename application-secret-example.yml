# 이 파일을 application-secret.yml 로 복사해서 값을 채운다.
#
#   cp application-secret-example.yml application-secret.yml
#
# 위치가 backend/ 루트다. 예전에는 src/main/resources 안에 있었는데,
# 서비스가 4개로 나뉘면서 복사본을 네 벌 두지 않으려고 루트로 옮겼다.
# 각 모듈의 application.yml 이 ../application-secret.yml 을 읽는다.
#
# .gitignore 에 걸려 있어 커밋되지 않는다.

# ---------------------------------------------------------------------------
# DB — 접속 주소는 공통, 계정은 서비스별
#
# 3단계(스키마·계정 분리)에서 계정이 1개 → 3개가 됐다.
# 서비스마다 자기 스키마만 소유하므로, 남의 테이블을 읽는 쿼리는
# permission denied 로 즉시 실패한다.
#
# 키 이름에 서비스명이 붙은 이유: 이 파일을 네 서비스가 공유한다.
# DB_USERNAME 같은 공통 키를 쓰면 한 값이 셋을 다 덮어써 분리가 무의미해진다.
# ---------------------------------------------------------------------------
DB_URL: jdbc:postgresql://localhost:5432/duo

USER_DB_USERNAME: duo_user
USER_DB_PASSWORD: local-user-pw
POST_DB_USERNAME: duo_post
POST_DB_PASSWORD: local-post-pw
CHAT_DB_USERNAME: duo_chat
CHAT_DB_PASSWORD: local-chat-pw
MATCH_DB_USERNAME: duo_match
MATCH_DB_PASSWORD: local-match-pw

# 관리용(마이그레이션 실행 등). 앱은 쓰지 않는다.
DB_USERNAME: duo
DB_PASSWORD: change-me-local-db-password

# ---------------------------------------------------------------------------
# RabbitMQ — 한 브로커를 두 용도로 쓴다
#   AMQP  :5672   서비스 간 이벤트 (post ↔ chat ↔ user)
#   STOMP :61613  채팅 메시지 릴레이 (브라우저 ↔ chat)
# 두 용도가 같은 계정을 쓴다.
# ---------------------------------------------------------------------------
RABBITMQ_USERNAME: appuser
RABBITMQ_PASSWORD: apppass

# ---------------------------------------------------------------------------
JWT_SECRET: replace-this-with-a-random-secret-at-least-32-bytes
JWT_EXPIRATION_MS: 86400000

UPLOAD_DIR: ./uploads

riot:
  api:
    key: RGAPI-xxxxxx-xxxxx....

# match-service의 AI 추천 이유 생성용
#비워두거나 dummy_key로
# 두면 규칙 기반 문구로 자동 대체되므로 로컬에서는 없어도 에러 없이 돌아간다.
LLM_API_KEY: sk-xxxxxxxxxxxxxxxxxxxx